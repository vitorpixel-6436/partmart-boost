name: Tests & Code Quality

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.11']
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov
      
      - name: Lint with pylint
        run: |
          pylint src/ --fail-under=7.0 || echo "⚠️ Pylint warnings (non-fatal)"
        continue-on-error: true
      
      - name: Format check with black
        run: |
          black --check src/ tests/ || echo "⚠️ Code formatting issues"
        continue-on-error: true
      
      - name: Run unit tests with pytest
        run: |
          pytest tests/ -v --cov=src --cov-report=xml --cov-report=term --tb=short
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
      
      - name: Test results summary
        if: always()
        run: echo "✅ Tests completed. Check logs for details."
